<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    h3 { margin: 0; font-size: 15px; color: #0f172a; }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12px; color: #64748b; text-align: center; }
    #results { margin-top: 10px; }
    .card-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4px solid #ef4444;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .card-safe {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4px solid #22c55e;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #15803d;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      font-size: 10px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>🛡️ Cyber-Safety Dark Pattern Detector</h3>
  </div>
  <button id="scanBtn">🔍 Scan Page with AI</button>
  <div id="status">Ready to scan checkout page</div>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
